name: NIFS-5 Pro Global Hyper-Parameter Matrix Backtest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-matrix-optimization:
    name: Execute Vectorized Multi-Timeframe Sweeps
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Step 1: Clean checkout ensuring the target workspace is explicitly initialized
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Step 2: Initialize clean Python Node without implicit workspace dependency mappings
      - name: Initialize Isolated Python Environment Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Explicitly print directory path to verify context loop integrity
      - name: Verify Workspace Directory Environment
        run: |
          echo "Active Node Workspace Path: $GITHUB_WORKSPACE"
          ls -la

      # Step 4: Install core mathematics libraries directly via pristine pip lines
      - name: Install Vectorized Mathematics Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      # Step 5: Execute the global parameter optimization grid search inside the true workspace
      - name: Execute Global Hyper-Parameter Grid Search Grid
        run: |
          if [ -f "global_hyper_optimizer.py" ]; then
            python global_hyper_optimizer.py
          elif [ -f "main.py" ]; then
            python main.py
          else
            echo "🚨 Critical Pipeline Error: Strategy execution engine script file not found at repository root!"
            echo "Current files present:"
            ls -la
            exit 1
    
          fi
